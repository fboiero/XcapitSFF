name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Gate — only proceed if CI passed
  # ===========================================================================
  gate:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passed
        run: echo "CI workflow completed successfully. Proceeding with deployment."

  # ===========================================================================
  # Build and push Docker image to registry
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value=deploy-{{date 'YYYYMMDDHHmmss'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy to staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "============================================="
          echo "  Deploying to STAGING environment"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          # Placeholder: Replace with actual deployment commands
          # Examples:
          #   - SSH to staging server and run deploy.sh
          #   - kubectl set image deployment/xcapitsff ...
          #   - aws ecs update-service ...
          #   - fly deploy ...
          echo "Staging deployment placeholder completed."

  # ===========================================================================
  # Smoke tests on staging
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          echo ""

          # Placeholder: Replace STAGING_URL with actual staging URL
          STAGING_URL="${STAGING_URL:-https://staging.xcapitsff.example.com}"

          # Health check
          echo "1. Health check..."
          # curl -sf "$STAGING_URL/health" || { echo "Health check failed"; exit 1; }
          echo "   Health check placeholder passed."

          # API readiness
          echo "2. API readiness..."
          # curl -sf "$STAGING_URL/api/v1/health" || { echo "API check failed"; exit 1; }
          echo "   API readiness placeholder passed."

          # Basic endpoint test
          echo "3. Basic endpoint test..."
          # curl -sf -o /dev/null -w "%{http_code}" "$STAGING_URL/" | grep -q "200"
          echo "   Endpoint test placeholder passed."

          echo ""
          echo "All smoke tests passed."
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}

  # ===========================================================================
  # Deploy to production (manual approval required)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-tests
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "============================================="
          echo "  Deploying to PRODUCTION environment"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          # Placeholder: Replace with actual production deployment commands
          # Examples:
          #   - SSH to production server and run deploy.sh
          #   - kubectl set image deployment/xcapitsff ...
          #   - aws ecs update-service ...
          #   - fly deploy ...
          echo "Production deployment completed."

      - name: Post-deploy verification
        run: |
          echo "Running post-deployment verification..."
          PROD_URL="${PROD_URL:-https://xcapitsff.example.com}"

          # Placeholder: Verify production is healthy
          # curl -sf "$PROD_URL/health" || { echo "Production health check failed!"; exit 1; }
          echo "Production verification placeholder passed."
        env:
          PROD_URL: ${{ vars.PROD_URL }}

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          # Placeholder: Send notification (Slack, Discord, email, etc.)
          # Example with Slack:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"XcapitSFF deployed to production: ${{ job.status }}"}' \
          #   "${{ secrets.SLACK_WEBHOOK_URL }}"
